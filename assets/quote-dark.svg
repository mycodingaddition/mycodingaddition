<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="200" viewBox="0 0 1280 200" role="img" aria-label="I don't write code to be remembered. I write it so someone, somewhere, has one less wall to climb.">
<rect x="28" y="10" width="1224" height="180" rx="18" fill="#0B0F19" stroke="#FFFFFF" stroke-opacity="0.16"/>
<text x="76" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#E11D2E">&#8220;</text>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <text x="150" y="92" font-size="30" font-weight="600" fill="#F5F5F2">I don&#8217;t write code to be remembered.</text>
  <text x="150" y="134" font-size="30" font-weight="600" fill="#F5F5F2">I write it so someone has one less wall to climb.</text>
  <text x="1210" y="166" text-anchor="end" font-size="16" letter-spacing="3" fill="#AEB4C2">AARAV</text>
</g>
</svg>