<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="290" viewBox="0 0 1280 290" role="img" aria-label="My vision: open doors through engineering; build things that are simple, honest and made to last; keep learning and help others build.">
<style>
  .rise { animation: rise .9s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes rise { from { opacity:0; transform: translateY(12px); } }
  @media (prefers-reduced-motion: reduce) { .rise { animation:none; opacity:1; } }
</style>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><g class="rise" style="animation-delay:0.15s">
  <rect x="28" y="20" width="384" height="250" rx="18" fill="#F0EFEA" stroke="#0B0F19" stroke-opacity="0.18"/>
  <text x="60" y="78" font-size="15" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="2" fill="#E11D2E">01</text>
  <text x="60" y="124" font-size="30" font-weight="700" letter-spacing="-.5" fill="#0B0F19">Open doors</text>
  <text x="60" y="168" font-size="18" fill="#4B5263">Use engineering to open doors for</text><text x="60" y="196" font-size="18" fill="#4B5263">people: in learning, in work and</text><text x="60" y="224" font-size="18" fill="#4B5263">in everyday life.</text>
</g><g class="rise" style="animation-delay:0.33s">
  <rect x="436" y="20" width="384" height="250" rx="18" fill="#F0EFEA" stroke="#0B0F19" stroke-opacity="0.18"/>
  <text x="468" y="78" font-size="15" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="2" fill="#E11D2E">02</text>
  <text x="468" y="124" font-size="30" font-weight="700" letter-spacing="-.5" fill="#0B0F19">Built to last</text>
  <text x="468" y="168" font-size="18" fill="#4B5263">Make things that are simple,</text><text x="468" y="196" font-size="18" fill="#4B5263">honest and made to last, not</text><text x="468" y="224" font-size="18" fill="#4B5263">loud and gone tomorrow.</text>
</g><g class="rise" style="animation-delay:0.51s">
  <rect x="844" y="20" width="384" height="250" rx="18" fill="#F0EFEA" stroke="#0B0F19" stroke-opacity="0.18"/>
  <text x="876" y="78" font-size="15" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="2" fill="#E11D2E">03</text>
  <text x="876" y="124" font-size="30" font-weight="700" letter-spacing="-.5" fill="#0B0F19">Build together</text>
  <text x="876" y="168" font-size="18" fill="#4B5263">Keep learning, keep building,</text><text x="876" y="196" font-size="18" fill="#4B5263">and help others build too.</text><text x="876" y="224" font-size="18" fill="#4B5263">Progress is a team sport.</text>
</g></g>
</svg>