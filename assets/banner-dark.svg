<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Aarav. Founder of Horvans. Engineering addict and coding addict, contributing to a better world.">
<style>
  .e { stroke:#FFFFFF; stroke-opacity:0.16; stroke-width:1.4; stroke-dasharray:260; stroke-dashoffset:0; animation: draw 1.6s cubic-bezier(.16,1,.3,1) backwards; }
  .n { animation: fade .6s ease-out backwards; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-out infinite 2s; opacity:0; }
  .rise { animation: rise .9s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes draw { from { stroke-dashoffset:260; } }
  @keyframes fade { from { opacity:0; } }
  @keyframes rise { from { opacity:0; transform: translateY(10px); } }
  @keyframes pulse { 0% { opacity:.7; transform: scale(1); } 100% { opacity:0; transform: scale(4.2); } }
  @media (prefers-reduced-motion: reduce) { .e { animation:none; stroke-dashoffset:0; } .n,.rise { animation:none; opacity:1; } .pulse { animation:none; } }
</style>
